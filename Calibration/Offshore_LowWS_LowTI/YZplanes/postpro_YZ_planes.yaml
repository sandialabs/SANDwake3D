globalattributes:
  verbose: False
  executeorder:
  - yzcoarse
  - yzwake1
  - yzwake2
  - yzwake3
  - yzwake4

yzcoarse:
    avgplanes:
      name: Wake YZ plane
      ncfile: 
      - /lustre/orion/cfd162/world-shared/lcheung/AdvancedControlsWakes/Runs/LowWS_LowTI.Frontier/oneturb_7x2/rundir_baseline/post_processing/YZcoarse_*nc
      tavg: [17800,18500]
      group: T0_YZdomain
      varnames: ['velocityx','velocityy','velocityz']
      savepklfile: 'YZ_coarse.pkl'

      rotorAvgVel:
        Diam: 240
        yc: 150
        xaxis: 'y'
        yaxis: 'z'
        avgfunc: "lambda db: db['velocityx_avg']"
        savefile: rotor_avg_vel_coarse.csv


