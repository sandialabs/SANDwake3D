doaveragesYZ:
  avgplanes:
  - name: YZwake1
    ncfile: RUNDIR_2T/YZwake_*.nc
    tavg: ~~TAVG~~
    varnames: [ 'velocityx', 'velocityy', 'velocityz'] 
    group: T0_YZ_wake1
    savepklfile: 'YZ_wake1.pkl'
    rotorAvgVel:
      Diam: 240
      yc: 150
      xaxis: 'y'
      yaxis: 'z'
      avgfunc: "lambda db: db['velocityx_avg']"
      savefile: rotor_avg_vel_wake1.csv

