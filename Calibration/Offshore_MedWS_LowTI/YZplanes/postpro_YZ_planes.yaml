globalattributes:
  verbose: False
  executeorder:
  - yzcoarse
  - yzwake1
  - yzwake2
  - yzwake3
  - yzwake4

yzcoarse:
    avgplanes:
      name: Wake YZ plane
      ncfile: 
      - /lustre/orion/cfd162/world-shared/lcheung/AdvancedControlsWakes/Runs/MedWS_LowTI.Frontier/oneturb_4x2/Baseline/MedWS_LowTI_4kmx2km_5m/post_processing/YZcoarse_*.nc
      tavg: [27750,28450]
      group: T0_YZdomain
      varnames: ['velocityx','velocityy','velocityz']
      savepklfile: 'YZ_coarse.pkl'

      rotorAvgVel:
        Diam: 240
        yc: 150
        xaxis: 'y'
        yaxis: 'z'
        avgfunc: "lambda db: db['velocityx_avg']"
        savefile: rotor_avg_vel_coarse.csv


